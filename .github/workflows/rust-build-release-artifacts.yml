name: rust-build-release-artifacts
on:
  release:
    types:
      - published
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
          - build: windows-gnu
            os: windows-latest
            target: x86_64-pc-windows-gnu
            suffix: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Tests
        run: cargo test --verbose
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/registry
          key: ${{ matrix.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/git
          key: ${{ matrix.target }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: ${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.target }}-binaries
          path: target/${{ matrix.target }}/release/pretty-logs${{ matrix.suffix }}
          retention-days: 1
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      - name: Upload assets to existing release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |-
          set -euxo pipefail
          # Prepare asset files with desired names
          cp x86_64-unknown-linux-gnu-binaries/pretty-logs pretty-logs-x86_64-unknown-linux-gnu
          cp x86_64-apple-darwin-binaries/pretty-logs pretty-logs-x86_64-apple-darwin
          cp x86_64-pc-windows-gnu-binaries/pretty-logs.exe pretty-logs-x86_64-pc-windows-gnu.exe
          # Upload assets to the existing release created by release-please
          gh release upload "$TAG" \
                      pretty-logs-x86_64-unknown-linux-gnu \
                      pretty-logs-x86_64-apple-darwin \
                      pretty-logs-x86_64-pc-windows-gnu.exe \
                      --clobber
